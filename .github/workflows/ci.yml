name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint (scoped), TypeScript, Tests, Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Full `npm run lint` carries pre-existing errors (debt); CI lints the privacy-critical files.
      - run: npm run lint:ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
